name: build

# Checks, builds and packages through the shared rea-launcher-sdk workflows
# (packaging/README.md in the SDK): fmt, host tests, cargo audit + deny,
# sh -n, linux/tests and packaging/tests, the sdk/ drift check, clippy and
# the release build for i686-pc-windows-gnu, its tests under Wine, the zip (packaging/package.sh)
# and the AppImage with a portable Wine, both checked against
# packaging/package.allow. Version tags publish a release with the tag's
# CHANGELOG section.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  ci:
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-ci.yml@v0.4.4
    with:
      apt-packages: gcc-mingw-w64-i686 lld zip unzip cabextract
      # The Windows-target tests (window, WinHTTP, registry) under Wine, headless.
      wine-tests: true
      shell-tests: linux/tests/*.sh packaging/tests/*.sh
      package-command: |
        name="OutRunLauncher-$REA_VERSION_NAME"
        OR_CACHE="$REA_CACHE" packaging/package.sh "dist/$name"
        (cd dist && zip -qr "$name.zip" "$name")
        "$REA_SDK/packaging/appimage-wine.sh" --app or --exe OutRunLauncher.exe \
          --icon packaging/appimage/outrun-launcher.png \
          --desktop packaging/appimage/outrun-launcher.desktop \
          --payload linux --optional-payload tweaks --optional-payload vc \
          --optional-payload soundtrack --cache "$REA_CACHE" \
          --name "$name" "dist/$name" dist
      package-dir: dist/OutRunLauncher-*.zip
      package-allowlist: packaging/package.allow
      artifact-name: OutRunLauncher-packages
      artifact-paths: |
        dist/*.zip
        dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-release.yml@v0.4.4
    with:
      package: or-launcher
      artifact-pattern: OutRunLauncher-*
