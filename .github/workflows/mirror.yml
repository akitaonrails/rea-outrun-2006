name: mirror

# Copies the pins marked "mirror" in packaging/dxvk.txt and
# packaging/vcredist.txt (licences that allow republishing: DXVK, the VC++
# redistributable) into this repository's `thirdparty` release, verified by sha256; package.sh lists
# those copies as fallbacks. Run by hand after changing a mirrored pin.

on: workflow_dispatch

permissions:
  contents: read

jobs:
  mirror:
    permissions:
      contents: write
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/mirror.yml@v0.4.1
    with:
      pins: packaging/dxvk.txt packaging/vcredist.txt
