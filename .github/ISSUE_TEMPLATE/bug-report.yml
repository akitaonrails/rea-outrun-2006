name: Bug report
description: "OutRunLauncher.exe does not run OutRun 2006: Coast 2 Coast as it should."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Never attach OR2006C2C.exe, DLLs, saves, media or any other
        game files. Remove usernames and personal paths from settings and logs.
  - type: dropdown
    id: system
    attributes:
      label: Where did you play?
      options:
        - Windows 11
        - Windows 10
        - Steam Deck (Game Mode)
        - Steam Deck (Desktop Mode)
        - Linux with Steam / Proton
        - Linux with the AppImage
        - Linux with Wine and or-play
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: The first line of launcher.log, e.g. "OutRunLauncher 0.1.0".
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: SHA-256 of OR2006C2C.exe
      description: |
        launcher.log names the game's edition, or the SHA-256 of a build it does not know.
        Windows: `certutil -hashfile OR2006C2C.exe SHA256`. Linux: `sha256sum OR2006C2C.exe`.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where your copy of the game comes from
      description: The DVD, a download store, or which repack (some repacks ship SpecialK or other mods).
  - type: input
    id: hardware
    attributes:
      label: CPU, graphics card, controller and screen
      description: e.g. "Ryzen 7 7800X3D, RTX 3060, Xbox-style pad, 2560x1440 at 144 Hz".
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings used
      description: The look and anything you changed, or launcher.cfg without personal paths.
  - type: textarea
    id: log
    attributes:
      label: launcher.log
      description: |
        Windows: %LOCALAPPDATA%\OutRunLauncher\launcher.log. Under Wine or Proton it is inside
        the prefix (or-play and the AppImage: ~/.local/share/or-launcher/prefix), and or-play
        also writes ~/.config/or-launcher/play.log. `OutRunLauncher --check` adds a check
        report to launcher.log. Remove personal paths before posting.
      render: text
    validations:
      required: true
