name: Something doesn't work
description: The launcher or the game misbehaves, or your OR2006C2C.exe isn't recognised.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Settings-window widgets, `rea-play.sh`, packaging and CI
        are shared with the other rea launchers: if the problem is there, it belongs at
        https://github.com/akitaonrails/rea-launcher-sdk/issues (we'll move it if unsure).
        Never attach game files.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where do you play?
      options:
        - Windows 10/11
        - Linux, the AppImage
        - Linux, or-play with my own Wine
        - Linux, Steam (Proton)
        - Steam Deck
        - Other (say below)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: The first line of launcher.log, e.g. "OutRunLauncher 0.1.0".
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: SHA-256 of your OR2006C2C.exe
      description: The window and launcher.log show it for a version the launcher doesn't know ("game:" line otherwise).
  - type: input
    id: source
    attributes:
      label: Where your copy of the game comes from
      description: DVD, a download store, which repack.
  - type: textarea
    id: log
    attributes:
      label: launcher.log
      description: |
        Windows: %LOCALAPPDATA%\OutRunLauncher\launcher.log.
        Linux: ~/.local/share/or-launcher/prefix/drive_c/users/<you>/AppData/Local/OutRunLauncher/launcher.log
        (plus ~/.config/or-launcher/play.log for or-play). `OutRunLauncher --check` adds a check report to it.
      render: text
    validations:
      required: true
