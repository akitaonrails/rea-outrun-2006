[workspace]
members = ["crates/or-launcher"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The shared launcher SDK (docs: its README). Bump the tag here and rerun
# scripts/sdk-sync from the SDK checkout at the same tag.
rea-launcher = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.3.3" }
rea-launcher-win32 = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.3.3" }
rea-launcher-ui = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.3.3" }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true
