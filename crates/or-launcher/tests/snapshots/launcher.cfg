# OutRun 2006 launcher settings.
#
# One setting per line as key = value; lines starting with # are comments.
# Command-line options (--resolution 1920x1080) override this file for one
# run. A launcher.cfg next to OutRunLauncher.exe is used instead of this one
# when it exists (portable installs).
#
# Unset settings get the launcher's defaults (the Coast to Coast look),
# shown in each #key = line. Everything is applied to the launcher's private
# copy of the game; your game folder is never changed.

# The folder with your installed OutRun 2006 (OR2006C2C.exe). It is only
# read, never changed.
# Values: a folder or file.
#game =

# Where the launcher keeps its private, writable copy of the game. Default:
# %LOCALAPPDATA%\OutRunLauncher\OutRun2006.
# Values: a folder or file.
#runtime =

# Where your saves (License.dat, your records) are kept: copied into the
# game before it starts and back when it ends. Default: Saved Games\OutRun
# 2006.
# Values: a folder or file.
#saves =

# A preset for every picture, control and extra setting at once: the game as
# it shipped, the tuned Coast to Coast set for your screen, or the Steam
# Deck's. Settings given on their own win over it.
# Values: original, coast_to_coast or steam_deck.
#look =

# The size the game draws at. Unset or original: the game's own 640x480.
# Values: WIDTHxHEIGHT, original or off.
#resolution = 1920x1080

# Takes over the screen instead of a borderless window. Holds the frame rate
# at 60.
# Values: on or off.
#fullscreen = off

# Frames per second: 10 to 240, or 0 (unlimited). Above 60 the picture is
# interpolated between the game's 60 ticks a second (experimental).
# Values: 10 to 240 or unlimited (0).
#fps_limit = 60

# Waits for the screen's refresh: no tearing, a little more delay.
# Values: on or off.
#vsync = on

# How much further down the road the scenery is drawn (0 is the game's own).
# Far out, scenery can pop in.
# Values: 0 to 8.
#draw_distance = 4

# How sharp the reflections on the car are, in pixels (original is 128).
# Values: original, 512, 1024 or 2048.
#reflections = 2048

# Keeps the road's texture sharp into the distance (0 is the game's own
# filtering).
# Values: 0 to 16.
#anisotropy = 16

# Smooths jagged edges (the game's own multisampling; on NVIDIA under
# Windows, trackside cloth and barriers too).
# Values: 0 or 2.
#antialiasing = 0

# The console versions' glowing sky.
# Values: on or off.
#sky_glow = on

# The brighter picture of the Xbox release.
# Values: on or off.
#xbox_brightness = off

# The detailed driver and passenger models the PC release shipped but never
# used.
# Values: on or off.
#hd_characters = on

# Linux: how the picture is enlarged to your screen: sharp blocks, even
# blocks, AMD FSR, or smooth.
# Values: nearest, pixel, fsr or linear.
#scaler = linear

# The community's sharper menus, HUD, sprites and button prompts. Get it in
# the HD Pack tab or with --download-hd-pack.
# Values: on or off.
#hd_textures = off

# Where the HD pack is (the folder it was unzipped into). Empty: the one the
# launcher downloaded, or textures-pack next to OutRunLauncher.exe.
# Values: a folder or file.
#hd_textures_folder =

# How far the stick moves before the car steers, in percent (the game's own
# is 20).
# Values: 0 to 50.
#deadzone = 20

# The pad shakes on shifts, drifts and crashes. Swapped trades the left and
# right motors; merged drives both together.
# Values: off, on, swapped or merged.
#vibration = on

# How strongly the pad shakes, 0 to 10.
# Values: 0 to 10.
#vibration_strength = 7

# Rumble in the triggers of Xbox One and Series pads, on Windows.
# Values: off, on, swapped or merged.
#impulse_triggers = swapped

# How the game reads pads; change it only if a pad isn't seen. Automatic:
# Windows.Gaming.Input (WGI) on Windows, XInput under Wine and Proton.
# Values: auto, wgi, raw, dinput or xinput.
#input_backend = auto

# Races start with the manual gearbox selected.
# Values: on or off.
#manual_gearbox = off

# Change the music during a race: Back or X for the next track, Z for the
# previous one.
# Values: on or off.
#cd_switcher = on

# The race music comes in a new order each time the game starts.
# Values: on or off.
#music_shuffle = off

# Straight to the title screen (a white screen shows for a moment while the
# game loads).
# Values: on or off.
#skip_logos = on

# No countdown timer: drive as long as you like.
# Values: on or off.
#free_drive = on

# The horn works all the time, not only when your passenger asks for it.
# Values: on or off.
#horn = on

# Roadside animations from every game mode can appear on any stage.
# Values: on or off.
#random_anims = on

# Shows your OutRun miles next to the menu's sign-in text.
# Values: on or off.
#show_miles = on

# Restores the first two seconds of "Rush a Difficulty" (an official patch
# to the launcher's copy of the song).
# Values: on or off.
#soundtrack_fix = on
