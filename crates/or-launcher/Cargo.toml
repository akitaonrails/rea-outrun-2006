[package]
name = "or-launcher"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Runs the user's own copy of OutRun 2006: Coast 2 Coast (PC) on modern Windows and under Proton/Wine"

[[bin]]
name = "OutRunLauncher"
path = "src/main.rs"

[dependencies]
rea-launcher.workspace = true
sha2.workspace = true
# The HD pack's zip: deflate only, pure Rust.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
rea-launcher-win32.workspace = true
rea-launcher-ui.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow"] }

# Only the HD pack download (WinHTTP) calls Windows itself; everything else
# goes through rea-launcher-win32.
[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = ["Win32_Foundation", "Win32_Networking_WinHttp"]
