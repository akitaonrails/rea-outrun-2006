[package]
name = "or-launcher"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Runs the user's own copy of OutRun 2006: Coast 2 Coast (PC) on modern Windows and under Proton/Wine"

[[bin]]
name = "OutRunLauncher"
path = "src/main.rs"

[dependencies]
# `zip`: the SDK's download unpacks the HD texture pack.
rea-launcher = { workspace = true, features = ["zip"] }
# The settings window (drawn and tested on any host).
rea-launcher-ui.workspace = true
# Its Windows parts are cfg(windows); who sees a message and what a second
# start does are portable (tested on the host).
rea-launcher-win32.workspace = true

[dev-dependencies]
# Headless window tests (egui_kittest, AccessKit queries).
rea-launcher-ui = { workspace = true, features = ["testing"] }
