[package]
name = "or-launcher"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Runs the user's own copy of OutRun 2006: Coast 2 Coast (PC) on modern Windows and under Proton/Wine"

[[bin]]
name = "OutRunLauncher"
path = "src/main.rs"

[dependencies]
sha2.workspace = true
# The HD pack's zip: deflate only, pure Rust.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow"] }
jpeg-decoder = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]
